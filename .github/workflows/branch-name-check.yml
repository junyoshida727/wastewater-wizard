name: Branch Name Check

on:
  pull_request:
    branches:
      - dev

jobs:
  check-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch naming convention
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          echo "Branch: $BRANCH"
          if [[ "$BRANCH" =~ ^(feature|fix|codex)/.+ ]]; then
            echo "OK: Branch name follows convention (feature/xxx, fix/xxx or codex/xxx)"
          else
            echo "ERROR: Branch name '$BRANCH' does not follow the convention."
            echo "Use: feature/<description>, fix/<description> or codex/<description>"
            exit 1
          fi
